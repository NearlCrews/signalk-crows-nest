# This workflow builds and tests the package, then publishes it to npm when a
# release is created.
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # Fail fast when the release tag and the package.json version disagree, so
      # a release can never publish a version that does not match its tag.
      - name: Verify the release tag matches the package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="$RELEASE_TAG"
          TAG="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify:release
      - name: Pack the verified package
        run: npm pack --json --ignore-scripts
      - name: Upload the verified package
        uses: actions/upload-artifact@043fb46e6fdd29d98e28f50e4e1eafdd665896dc # v7.0.0
        with:
          name: npm-package
          path: signalk-crows-nest-*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # id-token: write lets npm attach a provenance attestation to the published
    # package; contents: read is the least privilege the checkout needs.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45bce8c1d61861729d9749c869f45c2338d2 # v8.0.0
        with:
          name: npm-package
          path: artifacts
      - run: npm publish ./artifacts/signalk-crows-nest-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
