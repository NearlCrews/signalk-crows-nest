# Continuous integration: build, type-check, test, and lint the plugin on every
# push and pull request against main, across the supported Node.js versions.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The plugin runtime keeps its Node 20.3 floor, so this leg compiles the
      # plugin, type-checks, runs the node tests, lints, and audits on Node 20.
      # It does not build the panel: Babel 8 requires Node 22.18 or newer, so
      # the panel toolchain is exercised by the Node 22 leg below, and the Babel
      # contract test skips itself here.
      - name: Verify Node 20 runtime compatibility
        if: matrix.node-version == 20
        run: npm run build:plugin && npm run typecheck && npm test && npm run lint:code && npm run audit:runtime

      - name: Run the full project verification
        if: matrix.node-version == 22
        run: npm run verify

      # Informational, and deliberately allowed to fail. The runtime audit
      # above gates the release, because it covers the tree a consumer
      # installs, which is also what the Signal K plugin registry scores. This
      # one covers development tooling, where an advisory carries no runtime
      # exposure and may have no upstream fix to take, so it reports rather
      # than blocks. See docs/maintainers/releasing.md.
      - name: Full dependency audit
        if: matrix.node-version == 22
        continue-on-error: true
        run: npm run audit:full
