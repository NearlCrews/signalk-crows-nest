# Continuous integration: build, type-check, test, and lint the plugin on every
# push and pull request against main, across the supported Node.js versions.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Verify Node 20 runtime compatibility
        if: matrix.node-version == 20
        run: npm run build && npm run typecheck && npm test && npm run lint:code && npm run audit:runtime

      - name: Run the full project verification
        if: matrix.node-version == 22
        run: npm run verify
