name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The community plugin
# registry (https://signalk.org/signalk-plugin-registry/) credits a plugin only
# when a workflow run referencing
# SignalK/signalk-server/.github/workflows/plugin-ci.yml exists on the
# published version's commit; without one it applies a scoring penalty. A
# release is tagged from a commit already on main whose CI is green, so the push
# run on main is the run the registry credits, and no tag trigger is needed.
# The reusable workflow runs npm ci, the build, the tests, and npm pack across
# Linux x64, Linux arm64, macOS, and Windows on Node 22 and 24, with npm 11 on
# its Node 22 lanes. It no longer has an armv7 (Cerbo GX) or Node 20 job: the
# Node 20 leg in ci.yml is the only Node 20 coverage, and no CI exercises
# 32-bit ARM. Formatting and the coverage thresholds run once, inside the
# ci.yml verification gate, so this caller passes neither command, and the
# signalk-admin job in ci.yml supersedes the reusable integration job.
#
# Its lifecycle check also watches for an asynchronous crash: it installs
# uncaught-exception and unhandled-rejection handlers, drains briefly after
# `start()` resolves, and fails on anything it catches. That covers a plugin
# that starts cleanly and then takes the server down through an unowned
# 'error' event or a floating rejected promise, neither of which reaches the
# promise `start()` returns.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The registry reads only the newest 20 workflow runs for a release commit,
  # so the scheduled CodeQL and workflow security runs, and Dependabot, can push
  # the credited plugin-ci run out of that window while the release commit is
  # still the main HEAD. A weekly run, timed after every other Monday schedule
  # in this repository, keeps a fresh plugin-ci run among the newest.
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@faab2be886fa7d52f926e7d2acf91c910623d4d7
    with:
      build-command: npm run build
      test-command: npm test
      node-versions: '["22", "24"]'
