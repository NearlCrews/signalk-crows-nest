name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The community plugin
# registry (https://signalk.org/signalk-plugin-registry/) credits a plugin only
# when a workflow run referencing
# SignalK/signalk-server/.github/workflows/plugin-ci.yml exists on the
# published version's commit; without one it applies a scoring penalty. The
# tag trigger guarantees a run exists on the exact commit each release is
# published from. The reusable workflow runs npm ci, the build, the tests, and
# npm pack across Linux, macOS, and Windows on Node 22 and 24, plus the
# advisory armv7 Cerbo GX lane on Node 20, the lowest Node the plugin
# advertises. That lane cannot run the panel toolchain (Babel 8 requires Node
# 22.18 or newer), so `npm run build` skips the panel bundle there with a
# printed notice and the lane proves the plugin installs, compiles, and passes
# its tests; public/ is a prebuilt release artifact a Node 20 install never
# rebuilds.
#
# Its lifecycle check also watches for an asynchronous crash: it installs
# uncaught-exception and unhandled-rejection handlers, drains briefly after
# `start()` resolves, and fails on anything it catches. That covers a plugin
# that starts cleanly and then takes the server down through an unowned
# 'error' event or a floating rejected promise, neither of which reaches the
# promise `start()` returns.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@0495a4a94acd69443d94498b3b431738c2ba4eff
    with:
      build-command: npm run build
      test-command: npm test
      format-check-command: npm run format:check
      coverage-command: npm run test:coverage
      node-versions: '["22", "24"]'
      # Pinned true on purpose: engines.node still admits Node 20, so the
      # Cerbo GX lane is meaningful here, and scripts/build-panel.mjs keeps it
      # green by skipping the panel bundle below Node 22.18. It is
      # continue-on-error upstream, so ci.yml carries the blocking Node 20
      # runtime leg.
      enable-armv7: true
