version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # The shared UI is pinned exactly and ships breaking changes in 0.x
      # minors, so its update arrives alone and is reviewed against the
      # library's migration guide rather than merged inside the weekly batch.
      shared-ui:
        patterns:
          - signalk-nearlcrews-ui
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - signalk-nearlcrews-ui
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
